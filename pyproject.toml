[project]
name = "otpf"
version = "0.1.0"
description = "Differentiable particle filtering with entropy-regularised optimal transport resampling, benchmarked against exact Kalman gradients."
authors = [
    { name = "Pierre Chambet", email = "pierrechambet@gmail.com" }
]
requires-python = ">=3.12"
license = "MIT"
readme = "README.md"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "plotly>=7.1.0",
    "torch>=2.14.1",
]

[project.scripts]
otpf = "otpf.cli:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["legacy"]

[tool.ruff.lint]
extend-select = ["I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
